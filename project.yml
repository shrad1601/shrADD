name: ExpenseTracker
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.20.0
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - path: ExpenseTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shraddhasriram.expensetracker.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "shrADD."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Used to lock your Income tab so only you can view it."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: FirebaseiOS
        product: FirebaseFirestore
      - package: FirebaseiOS
        product: FirebaseAuth
